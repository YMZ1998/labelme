[ring]
# Curved-boundary point spacing in image pixels.
# Increase this value to generate fewer points; decrease it for more detail.
# The two straight cutting sides always contain exactly 3 points each.
point_spacing = 36

[strip]
# Distance from the clicked centerline to either side, in image pixels.
# The full generated strip width is approximately twice this value.
half_width = 4

[labels]
# Default labels for the three ROI drawing tools.
polygon = 1
strip = 2
ring = 5

[shortcuts]
# Tool shortcuts can be changed to match personal habits.
create_strip = Ctrl+Q
create_ring = Ctrl+W
create_polygon = Ctrl+E
